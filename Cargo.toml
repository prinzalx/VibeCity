[package]
name = "vibecity"
version = "0.2.0"
edition = "2021"
description = "Clean-room host tool for Casio PX-S1100 (protocol per docs/protocol.json)"
license = "MIT"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }

[target.'cfg(windows)'.dependencies]
midir = "0.11"

[[bin]]
name = "vibecity"
path = "src/main.rs"

[[bin]]
name = "vibecity-gui"
path = "src/gui.rs"

[lib]
name = "vibecity"
path = "src/lib.rs"
